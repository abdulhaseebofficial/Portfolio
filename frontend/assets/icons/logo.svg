<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="400" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1B4FD8"/>
      <stop offset="100%" stop-color="#0F2D8A"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#E85D26"/>
      <stop offset="100%" stop-color="#C94010"/>
    </linearGradient>
    <clipPath id="rounded">
      <rect width="400" height="400" rx="88" ry="88"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="88" ry="88" fill="url(#bgGrad)"/>

  <!-- Subtle grid texture -->
  <g opacity=".06" clip-path="url(#rounded)">
    <line x1="0" y1="80" x2="400" y2="80" stroke="white" stroke-width="1"/>
    <line x1="0" y1="160" x2="400" y2="160" stroke="white" stroke-width="1"/>
    <line x1="0" y1="240" x2="400" y2="240" stroke="white" stroke-width="1"/>
    <line x1="0" y1="320" x2="400" y2="320" stroke="white" stroke-width="1"/>
    <line x1="80" y1="0" x2="80" y2="400" stroke="white" stroke-width="1"/>
    <line x1="160" y1="0" x2="160" y2="400" stroke="white" stroke-width="1"/>
    <line x1="240" y1="0" x2="240" y2="400" stroke="white" stroke-width="1"/>
    <line x1="320" y1="0" x2="320" y2="400" stroke="white" stroke-width="1"/>
  </g>

  <!-- Accent bar chart decoration (data analytics) -->
  <g opacity=".18">
    <rect x="30" y="280" width="22" height="60" rx="4" fill="white"/>
    <rect x="62" y="255" width="22" height="85" rx="4" fill="white"/>
    <rect x="94" y="235" width="22" height="105" rx="4" fill="white"/>
  </g>

  <!-- Orange accent dot top-right -->
  <circle cx="340" cy="60" r="18" fill="#E85D26" opacity=".9"/>
  <circle cx="340" cy="60" r="10" fill="#E85D26"/>

  <!-- AH monogram -->
  <!-- A -->
  <text
    x="86"
    y="262"
    font-family="'Bricolage Grotesque', 'Arial Black', sans-serif"
    font-size="200"
    font-weight="800"
    letter-spacing="-12"
    fill="white"
  >AH</text>

  <!-- Bottom accent line -->
  <rect x="40" y="348" width="100" height="6" rx="3" fill="#E85D26"/>
  <rect x="150" y="348" width="40" height="6" rx="3" fill="white" opacity=".3"/>

  <!-- "data & analytics" small text -->
  <text
    x="40"
    y="382"
    font-family="'Plus Jakarta Sans', 'Arial', sans-serif"
    font-size="22"
    font-weight="600"
    fill="white"
    opacity=".55"
    letter-spacing="3"
  >DATA &amp; ANALYTICS</text>
</svg>
